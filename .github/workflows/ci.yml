name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install --yes pkg-config libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo check -p kondo-ics --no-default-features
      - name: CLI help without hardware
        run: cargo run --locked -p kondo-ics-rs485 --bin kondo-ics-cli -- --help
